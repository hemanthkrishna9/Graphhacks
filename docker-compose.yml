# FalkorDB with Ripple's pre-built eShop graphs.
# On first start the seed snapshot (data/dump.rdb) is copied into the volume; after that the volume is the source of truth.
services:
  falkordb:
    # The exact build Ripple was developed and evaluated against (FalkorDB graph module 60002).
    image: falkordb/falkordb@sha256:107455e862a824e45e8e9f5a7fbfdf5e00a08b14e13eae2577c72fd9e3f59ba6
    entrypoint:
      - /bin/sh
      - -c
      - "[ -f /var/lib/falkordb/data/dump.rdb ] || cp /seed/dump.rdb /var/lib/falkordb/data/dump.rdb; exec /var/lib/falkordb/bin/run.sh"
    ports:
      - "6379:6379"   # Redis protocol (Ripple CLI, MCP server)
      - "3000:3000"   # FalkorDB Browser
    volumes:
      - falkordb-data:/var/lib/falkordb/data
      - ./data/dump.rdb:/seed/dump.rdb:ro
volumes:
  falkordb-data:
